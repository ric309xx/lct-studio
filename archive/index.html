  <footer><span>© LCT STUDIO</span><span>LANDSCAPE / AERIAL / REALITY CAPTURE</span></footer>

  <div id="photo-modal" class="photo-modal" hidden role="dialog" aria-modal="true" aria-label="照片檢視">

    <img id="photo-full" alt="">
